name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      - run: nix develop .#ci --command just check-fmt
      - run: nix develop .#ci --command just buck2-audit
      - run: nix develop .#ci --command just reindeer-clean
      - run: nix develop .#ci --command just check-license-headers

  # Computes the set of Buck2 targets impacted by this change. A push to main has
  # no useful base ref, so it passes an empty base and gets the whole workspace.
  changed-targets:
    uses: ./.github/workflows/_changed-targets.yml
    with:
      base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: riscv64
            platform: "//platforms:riscv64"
          - name: aarch64
            platform: "//platforms:aarch64"
          - name: x86_64
            platform: "//platforms:x86_64"
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changed-targets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: buck-out
          key: buck2-${{ runner.os }}-${{ github.job }}-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            buck2-${{ runner.os }}-${{ github.job }}-${{ matrix.name }}-
            buck2-${{ runner.os }}-${{ github.job }}-
            buck2-${{ runner.os }}-
      - env:
          TARGETS: ${{ needs.changed-targets.outputs.targets }}
        run: nix develop .#ci --command just platform=${{ matrix.platform }} clippy "$TARGETS"

  unittests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changed-targets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: buck-out
          key: buck2-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            buck2-${{ runner.os }}-${{ github.job }}-
            buck2-${{ runner.os }}-
      - env:
          TARGETS: ${{ needs.changed-targets.outputs.targets }}
        run: nix develop .#ci --command just unittests "$TARGETS"

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changed-targets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: buck-out
          key: buck2-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            buck2-${{ runner.os }}-${{ github.job }}-
            buck2-${{ runner.os }}-
      - env:
          TARGETS: ${{ needs.changed-targets.outputs.targets }}
        run: nix develop .#ci --command just miri "$TARGETS"

  loom:
    runs-on: ubuntu-latest
    needs: [changed-targets]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: buck-out
          key: buck2-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            buck2-${{ runner.os }}-${{ github.job }}-
            buck2-${{ runner.os }}-
      - env:
          TARGETS: ${{ needs.changed-targets.outputs.targets }}
        run: nix develop .#ci --command just loom "$TARGETS"

  # `just selftests` narrows whatever it is handed to `kind(qemu_test, …)`, so an
  # unaffected loader drops out on its own and both boot concurrently under one
  # `buck2 test` invocation.
  selftests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changed-targets]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: buck-out
          key: buck2-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            buck2-${{ runner.os }}-${{ github.job }}-
            buck2-${{ runner.os }}-
      - env:
          TARGETS: ${{ needs.changed-targets.outputs.targets }}
        run: nix develop .#ci --command just selftests "$TARGETS"

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/advisory-db
          key: cargo-deny-${{ runner.os }}-${{ hashFiles('third-party/Cargo.lock') }}
          restore-keys: |
            cargo-deny-${{ runner.os }}-
      - run: nix develop .#ci --command just cargo-deny

  # Aggregate gate for branch protection. This is the SINGLE required status
  # check in the `main CI` ruleset, so the matrix can grow or shrink without
  # touching the ruleset. It always runs, and fails only when a dependency
  # actually failed or was cancelled.
  ci-status:
    name: ci-status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - lint
      - changed-targets
      - clippy
      - unittests
      - miri
      - loom
      - selftests
      - cargo-deny
    steps:
      - name: Report dependency results
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
      - name: Fail if any dependency failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
