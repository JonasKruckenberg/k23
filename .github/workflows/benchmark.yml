name: Benchmarks

# Triggers:
#   push: main          → run the full benchmark suite (continuous baseline).
#   pull_request        → only when the `bench` label is set, runs benchmarks only for targets changed by the PR.
#   workflow_dispatch   → manual full run.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  # Cancel in-flight runs on PRs (latest push wins). On main we want every
  # commit's data point preserved, so do not cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changed-targets:
    uses: ./.github/workflows/_changed-targets.yml
    with:
      base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  benchmarks:
    runs-on: ubuntu-latest
    needs: [changed-targets]
    # only run benchmarks if EITHER: we pushed to main OR the PR is tagged with the `bench` label.
    #
    # PRs will only run affected benchmarks by default, pushes to main or manual dispatches run everything
    if: |
      ${{ github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'bench'))
      }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
      # Always restore the latest baseline so PRs compare against main.
      # Saving is gated to push-on-main below so PRs cannot poison the baseline.
      - name: restore criterion baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bench
          key: bench-${{ github.sha }}
          restore-keys: |
            bench-
      - env:
          TARGETS: ${{ needs.changed-targets.outputs.targets }}
        run: nix develop .#ci --command just benchmark "$TARGETS"
      - name: save criterion baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bench
          key: bench-${{ github.sha }}
