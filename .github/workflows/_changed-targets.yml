name: changed-targets

# Reusable workflow that computes the set of Buck2 targets impacted by a change
# and exposes them to downstream jobs as a single output:
#
#   `targets`: space-separated target list to hand to `just <recipe> '<targets>'`.
#              `//...` means the whole workspace, empty means nothing is affected
#
# All the logic lives in `just changed-targets`, so CI runs exactly the same code
# path as a local `just preflight`.

on:
  workflow_call:
    inputs:
      base:
        description: "revision to diff against; empty means run the whole workspace"
        type: string
        default: ""
    outputs:
      targets:
        description: "space-separated impacted targets; `//...` = whole workspace"
        value: ${{ jobs.changed-targets.outputs.targets }}

permissions:
  contents: read

jobs:
  changed-targets:
    name: Determine changed targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      targets: ${{ steps.compute.outputs.targets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D

      # BASE goes through the environment rather than being interpolated into the
      # script: `${{ }}` is substituted before bash ever sees the line, so a ref
      # containing shell metacharacters would be executed rather than read.
      - name: Compute impacted targets
        id: compute
        env:
          BASE: ${{ inputs.base }}
        run: |
          if [ -z "$BASE" ]; then
            echo '//...' > targets.txt
          else
            nix develop .#ci --command just changed-targets "$BASE" < /dev/null > targets.txt
          fi
          targets=$(cat targets.txt)
          echo "Impacted: ${targets:-<none>}"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
